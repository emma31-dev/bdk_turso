name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --all-features --locked
      - run: cargo check --no-default-features --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps --locked
      - name: Check tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Check changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          }
      - name: Check packaged files
        run: |
          cargo package --list --locked > "$RUNNER_TEMP/package-files.txt"
          for path in \
            README.md \
            migrations/0001_default_schema.up.sql \
            migrations/0002_wallet_schema.up.sql \
            migrations/0003_psbt.up.sql \
            examples/example.toml \
            examples/wallet.rs \
            examples/transaction.rs; do
            grep -qx "$path" "$RUNNER_TEMP/package-files.txt" || {
              echo "::error::missing $path from the published package"
              exit 1
            }
          done
      - run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check crates.io credentials
        id: credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "use_oidc=false" >> "$GITHUB_OUTPUT"
          else
            echo "use_oidc=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        if: steps.credentials.outputs.use_oidc == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --locked

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && $0 ~ "^## \\[" { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no changelog entry found for $version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "bdk_turso $version" \
            --notes-file release-notes.md
