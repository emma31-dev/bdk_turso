name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --all-features --locked
      - run: cargo check --no-default-features --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps --locked

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check packaged files
        run: |
          cargo package --list --locked > "$RUNNER_TEMP/package-files.txt"
          for path in \
            README.md \
            migrations/0001_default_schema.up.sql \
            migrations/0002_wallet_schema.up.sql \
            migrations/0003_psbt.up.sql \
            examples/example.toml \
            examples/wallet.rs \
            examples/transaction.rs; do
            grep -qx "$path" "$RUNNER_TEMP/package-files.txt" || {
              echo "::error::missing $path from the published package"
              exit 1
            }
          done
      - run: cargo publish --dry-run --locked
