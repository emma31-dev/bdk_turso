[package]
name = "bdk_turso"
version = "0.3.2"
authors = ["Emmanuel Fidelis"]
rust-version = "1.88.0"
edition = "2024"
description = "Turso persistence backend for BDK"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emma31-dev/bdk_turso"
documentation = "https://docs.rs/bdk_turso"
exclude = ["PROPOSAL.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bdk_chain = { version = "0.23.4", features = ["miniscript"] }
bdk_wallet = { version = "3.2.1", optional = true }
turso = { version = "0.8.3", default-features = false, features = ["pure-rust-crypto"] }
rand = "0.10"
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
# Keep this in sync with Turso's `branches ^0.4.3` requirement. A direct dependency on the same
# version unifies the `std` feature and avoids the incompatible nightly intrinsic path in Turso's
# dependency graph; bumping to 0.5 would create a second copy and lose that workaround.
branches = { version = "0.4.6", default-features = false, features = ["std"] }

[dev-dependencies]
anyhow = "1"
bdk_wallet = { version = "3.2.1", features = ["test-utils"] }
bdk_bitcoind_rpc = "0.22.1"
bdk_sqlite = "0.6.0"
bdk_redb = "0.2.0"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"

[features]
default = ["wallet"]
wallet = ["dep:bdk_wallet", "blocking"]
blocking = ["dep:tokio"]
psbt = []
remote = ["turso/sync"]

[[example]]
name = "wallet"
required-features = ["wallet"]

[[example]]
name = "transaction"
required-features = ["wallet", "psbt"]

[[bench]]
name = "backends"
harness = false
required-features = ["wallet"]
